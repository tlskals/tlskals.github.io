# Side Projects

- project: 기사님, 잠시만요! (WaitPlz)
  role: Full Stack / Mobile Developer (1인 개발)
  duration: 2026-10 &mdash; 진행중
  stack: Flutter, Dart, Riverpod 3.x, TAGO 공공데이터 API, 네이버 지도 SDK, Geolocator
  description1: |
    '기사님, 잠시만요!'는 매일 장거리 대중교통으로 출퇴근하는 직장인을 위해 앱 실행 즉시 내가 탈 버스·지하철의 실시간 도착 정보를 제공하고, 졸음으로 인한 하차역 놓침을 방지하는 스마트 출퇴근 교통 플랫폼입니다.<br><br>
    
    국토교통부 TAGO 및 서울시/경기도 버스·지하철 공공데이터 API를 연동하여 전국 138개 지자체 실시간 버스 도착 정보와 상·하행 양방향 대시보드를 구축하였으며, 공공데이터포털 초당 호출 제한(Rate Limit)을 극복하기 위해 비동기 청크 배치(Chunked Concurrency) 및 지자체 코드 동적 추론 캐싱 알고리즘을 설계하였습니다.<br><br>
    
    또한 백그라운드 위치 추적(Geolocator) 기반의 GPS 지오펜싱 알고리즘을 구현하여 화면이 꺼진 상태에서도 목적지 반경(300m~2,000m) 진입 시 강력한 진동과 소리로 깨워주는 스마트 하차 알림 기능을 개발하였으며, Clean Architecture와 Riverpod 3.x를 적용하여 높은 코드 품질과 확장성을 확보하였습니다.
  description2: 자세한건 아래 링크를 통해 보실 수 있습니다.
  repository: Github Repository
  repository-url: "https://github.com/tlskals/WaitPlz"

- project: 같이타요 (Ride Together)
  role: Full Stack / Mobile Developer (1인 개발)
  duration: 2026-08-29 &mdash; 2026-10-05
  stack: Flutter, Firebase, Open-Meteo API
  description1: |
    같이타요(Ride Together)는 전국의 스키 & 스노보드 라이더들을 위한 실시간 슬로프 메이트 매칭 및 스키장 기상 정보 제공 플랫폼입니다.<br><br>
    
    Firebase Cloud Functions와 Firestore를 기반으로 4인 실시간 랜덤 매칭 시스템 및 어뷰징 방지 페널티 로직을 설계하였으며, 전국 12개 스키장별 맞춤 피드와 Open-Meteo 글로벌 기상 API를 연동하여 실시간 기온 및 5일 강설량 예보 시스템을 구축하였습니다.<br><br>
    
    안전한 이용 환경을 위해 금칙어 실시간 차단, 원터치 유저 차단 및 누적 신고 자동 블라인드 정책을 적용하였으며, 매일 새벽 만료 피드 자동 정리 스케줄러와 FCM 푸시 알림 중복 방지 로직을 최적화하여 1인 풀스택으로 기획부터 앱 패키징(AAB/IPA)까지 완수하였습니다.
  description2: 자세한건 아래 링크를 통해 보실 수 있습니다.
  repository: Github Repository
  repository-url: "https://github.com/tlskals/eatSleepRide"
